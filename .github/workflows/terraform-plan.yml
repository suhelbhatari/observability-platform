# Runs on every PR touching terraform/. Posts the plan for both regions as a PR
# comment so reviewers see the actual infra diff, not just the code diff.
name: Terraform Plan

on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-plan.yml"

permissions:
  id-token: write   # required for OIDC -> AWS role assumption (no long-lived keys)
  contents: read
  pull-requests: write

env:
  TF_VERSION: "1.7.5"

jobs:
  plan:
    strategy:
      fail-fast: false
      matrix:
        environment: [prod-us-east-1, prod-eu-west-1]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/environments/${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform fmt check
        run: terraform fmt -check -recursive ../../

      - name: terraform init
        run: terraform init -input=false

      - name: terraform validate
        run: terraform validate

      - name: terraform plan
        id: plan
        run: |
          terraform plan -input=false -no-color \
            -var="certificate_arn=${{ secrets.ACM_CERT_ARN }}" \
            -var="internal_zone_id=${{ secrets.INTERNAL_ZONE_ID }}" \
            -out=tfplan | tee plan_output.txt
        continue-on-error: true

      - name: Post plan as PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('terraform/environments/${{ matrix.environment }}/plan_output.txt', 'utf8').slice(-60000);
            const body = `#### Terraform Plan — \`${{ matrix.environment }}\`\n<details><summary>Show plan</summary>\n\n\`\`\`\n${plan}\n\`\`\`\n</details>`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      - name: Fail job if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1
